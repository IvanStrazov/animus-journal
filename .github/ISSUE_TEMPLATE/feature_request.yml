name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the journal makes hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed change
  - type: dropdown
    id: budget
    attributes:
      label: Effect on the token budget
      description: animus-journal keeps context cost small. Would this add tokens at session start or a frequently firing hook?
      options:
        - "No effect"
        - "Adds a little (explain below)"
        - "Not sure"
    validations:
      required: true
